<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="sheetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0" />
      <stop offset="50%" stop-color="#34d399" stop-opacity="1" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Inner Soft Shadow -->
  <rect x="24" y="24" width="464" height="464" rx="96" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="4" />

  <!-- Receipt Paper Container -->
  <g transform="translate(116, 96)">
    <!-- Base Paper -->
    <path d="M 0 32 C 0 14.33 14.33 0 32 0 L 216 0 C 233.67 0 248 14.33 248 32 L 248 296 L 220 280 L 190 296 L 160 280 L 130 296 L 100 280 L 70 296 L 40 280 L 10 296 L 0 290 Z" fill="url(#sheetGrad)" filter="drop-shadow(0 16px 24px rgba(0,0,0,0.25))" />

    <!-- Header Logo on Receipt -->
    <rect x="36" y="44" width="60" height="12" rx="6" fill="#059669" />
    <rect x="104" y="44" width="108" height="12" rx="6" fill="#cbd5e1" />

    <!-- Receipt Line Items -->
    <rect x="36" y="80" width="120" height="10" rx="5" fill="#94a3b8" />
    <rect x="176" y="80" width="36" height="10" rx="5" fill="#059669" />

    <rect x="36" y="108" width="100" height="10" rx="5" fill="#94a3b8" />
    <rect x="176" y="108" width="36" height="10" rx="5" fill="#059669" />

    <rect x="36" y="136" width="130" height="10" rx="5" fill="#94a3b8" />
    <rect x="176" y="136" width="36" height="10" rx="5" fill="#059669" />

    <!-- Separator Dotted Line -->
    <line x1="36" y1="168" x2="212" y2="168" stroke="#cbd5e1" stroke-width="3" stroke-dasharray="6,6" />

    <!-- Total Row -->
    <rect x="36" y="190" width="60" height="14" rx="7" fill="#0f172a" />
    <rect x="156" y="190" width="56" height="14" rx="7" fill="#059669" />

    <!-- Barcode simulation -->
    <g transform="translate(44, 230)" fill="#64748b">
      <rect x="0" y="0" width="4" height="24" />
      <rect x="8" y="0" width="8" height="24" />
      <rect x="20" y="0" width="3" height="24" />
      <rect x="28" y="0" width="6" height="24" />
      <rect x="38" y="0" width="4" height="24" />
      <rect x="46" y="0" width="8" height="24" />
      <rect x="58" y="0" width="2" height="24" />
      <rect x="64" y="0" width="6" height="24" />
      <rect x="74" y="0" width="4" height="24" />
      <rect x="82" y="0" width="10" height="24" />
      <rect x="96" y="0" width="4" height="24" />
      <rect x="104" y="0" width="7" height="24" />
      <rect x="115" y="0" width="4" height="24" />
      <rect x="123" y="0" width="8" height="24" />
      <rect x="135" y="0" width="3" height="24" />
      <rect x="142" y="0" width="8" height="24" />
      <rect x="154" y="0" width="5" height="24" />
    </g>

    <!-- Glowing Scan Line -->
    <rect x="-30" y="112" width="308" height="6" rx="3" fill="url(#laserGrad)" filter="url(#glow)" />
    <rect x="-10" y="113" width="268" height="4" rx="2" fill="#ffffff" />
  </g>

  <!-- Modern Floating "L" Check Badge -->
  <g transform="translate(320, 310)" filter="drop-shadow(0 12px 20px rgba(0,0,0,0.35))">
    <circle cx="50" cy="50" r="50" fill="#10b981" />
    <circle cx="50" cy="50" r="46" fill="#0f766e" />
    <path d="M 32 50 L 44 62 L 68 38" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
