<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>BillTrack - Smart Receipt Scanner &amp; Price Tracker</title>
    <meta name="description" content="Scan receipts from DMart, Smart Bazaar &amp; local stores. Track when you last bought any item with price and store details, categorize groceries, and view monthly spending trends." />
    <meta property="og:title" content="BillTrack - Smart Receipt Scanner &amp; Price Tracker" />
    <meta property="og:description" content="Scan receipts from DMart, Smart Bazaar &amp; local stores. Track when you last bought any item with price and store details, categorize groceries, and view monthly spending trends." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Theme & PWA Manifest -->
    <meta name="theme-color" content="#059669" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />

    <!-- iOS Safari PWA Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Logify" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(function(err) {
            console.log('SW registration note:', err);
          });
        });
      }
    </script>
  </body>
</html>
